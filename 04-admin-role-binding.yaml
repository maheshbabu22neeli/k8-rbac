apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-binding
  namespace: roboshop

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin-role

subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: suresh # "name" is case sensitive, and it is created through aws console

